<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>Training Dashboard</h1>
    <p class="principle">Pace guides progress. <span>Heart rate guides execution.</span></p>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#dashboard" data-tab="dashboard">Dashboard</a>
    <a href="#progression" data-tab="progression">Progression</a>
    <a href="#races" data-tab="races">Races</a>
    <a href="#settings" data-tab="settings">Settings</a>
  </nav>
  <div class="uploadbox">
    <input type="file" id="upload-files" multiple accept=".fit,.gpx,.tcx,.zip" hidden>
    <label for="upload-files" class="btn">Upload files</label>
    <span id="upload-status" class="muted"></span>
  </div>
</header>
<main id="view" class="wrap"></main>
<div id="tooltip" class="tooltip" hidden></div>
<script src="/app.js"></script>
</body>
</html>
